apiVersion: v1
kind: ServiceAccount
metadata:
  name: iviaop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: view-configmap-secret-ivia
rules:
  - apiGroups: ['']
    resources: ['secrets', 'configmaps']
    verbs: ['get', 'list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: default-iviaop-view-configmap-secret
subjects:
  - kind: ServiceAccount
    name: iviaop
roleRef:
  kind: Role
  name: view-configmap-secret-ivia
  apiGroup: rbac.authorization.k8s.io
