apiVersion: apps/v1
kind: Deployment
metadata:
  name: ivd
  labels:
    app: ivd
spec:
  selector:
    matchLabels:
      app: ivd
  template:
    metadata:
      labels:
        app: ivd
    spec:
      serviceAccountName: ivd
      volumes:
        - name: config-volume
          configMap:
            name: ivd-server-config
        - name: data-volume
          persistentVolumeClaim:
            claimName: ivdclaim
        - name: ldap-schemas
          configMap:
            name: ldap-schemas
            items:
              - key: am-user.at
                path: am-user.at
              - key: am-user.oc
                path: am-user.oc
      containers:
        - name: ivd
          image: icr.io/isvd/verify-directory-server:10.0.4.0
          ports:
            - containerPort: 9389
            - containerPort: 9636
          env:
            - name: YAML_CONFIG_FILE
              value: /var/isvd/config/config.yaml
          volumeMounts:
            - mountPath: /var/isvd/config
              name: config-volume
            - mountPath: /var/isvd/data
              name: data-volume
            - mountPath: /volume/schemas
              name: ldap-schemas
              readOnly: true
          livenessProbe:
            exec:
              command:
                - /sbin/health_check.sh
                - livenessProbe
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - /sbin/health_check.sh
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: ivd-internal
spec:
  ports:
    - port: 389
      name: ldap
      targetPort: 9389
  selector:
    app: ivd
